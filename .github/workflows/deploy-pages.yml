name: Deploy to GitHub Pages

# Manual trigger only, so a fresh clone of the template never has a failing
# workflow. Before the first run: repository Settings -> Pages -> Source ->
# "GitHub Actions". To deploy on every push to main, add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

env:
  EMSDK_VERSION: 4.0.19

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build
        run: python3 scripts/build.py --config release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web-release/dist

      - id: deployment
        uses: actions/deploy-pages@v4
